name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin
  MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn -Dmaven.wagon.http.retryHandler.count=3"
  MVN: ./mvnw -B -ntp -Dskip.web=true

jobs:
  build:
    name: Compile & validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Validate POM
        run: $MVN validate

      - name: Compile (main + tests)
        run: $MVN test-compile

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run unit tests
        run: $MVN test -Dsurefire.useFile=false -Dsurefire.printSummary=true

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit tests
          path: "**/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7

  integration-tests:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run integration tests
        run: $MVN verify -DskipUTs=false -Dsurefire.useFile=false -Dfailsafe.useFile=false
        env:
          TESTCONTAINERS_RYUK_DISABLED: "false"
          DOCKER_HOST: unix:///var/run/docker.sock

      - name: Publish IT report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration tests
          path: "**/target/failsafe-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-error: false

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: target/site/jacoco/jacoco.xml
          flags: integration
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  arch-tests:
    name: Architecture tests (ArchUnit)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run ArchUnit tests
        run: $MVN test -Dtest='*Architecture*'

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep scan
        run: |
          semgrep ci \
            --config p/java \
            --config p/security-audit \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif --output=semgrep.sarif || true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  web-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci --no-audit --no-fund --prefer-offline

      - name: Type-check
        working-directory: web
        run: npm run type-check

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload static bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: src/main/resources/static/
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [unit-tests, web-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Build OCI image with frontend bundled — image must have the SPA inside.
      # We skip the frontend-maven-plugin (no node download to target/) and
      # build the SPA via the cached npm setup we already have.
      - name: Build frontend into static/
        working-directory: web
        run: |
          npm ci --no-audit --no-fund --prefer-offline
          npm run build

      - name: Build OCI image
        run: ./mvnw -B -ntp spring-boot:build-image -DskipTests -Dskip.web=true -Dspring-boot.build-image.imageName=pix-automatico-reference:ci

      - name: Trivy scan (image)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pix-automatico-reference:ci
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  ci-status:
    name: CI status
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, arch-tests, semgrep, web-build, docker]
    if: always()
    steps:
      - name: Aggregate status
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required jobs passed"
